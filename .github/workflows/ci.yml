name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Test the core brain package (training, inference, export)
  brain-core-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CogniSeer1.0-main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Make
        run: sudo apt-get update && sudo apt-get install -y make

      - name: Install Locked Dependencies
        run: make install-lock

      - name: Install Dev Tooling
        run: make install-dev-lock

      - name: Install Package
        run: make install

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Security Scan
        run: make security

      - name: Run Brain Core Tests
        run: make test

      - name: Run Smoke Tests
        run: make smoke

  # Test the robot_brain_ros2 ROS2 components (inference, sensors, transforms)
  ros2-inference-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip

      - name: Install Test Dependencies
        run: |
          pip install pytest pytest-cov numpy

      - name: Run robot_brain_ros2 Unit Tests
        run: |
          cd CogniSeer1.0-main/robot_brain_ros2
          python -m pytest tests/test_sensor_aggregator.py -v
          python -m pytest tests/test_transform_broadcaster.py -v
          python -m pytest tests/test_integration_ros2_stack.py -v

      - name: Generate Coverage Report
        run: |
          cd CogniSeer1.0-main/robot_brain_ros2
          python -m pytest tests/ --cov=robot_brain_ros2 --cov-report=term-missing

  # Test the robot_brain_stack ROS2 integration stack (behavior trees, recovery, Nav2)
  ros2-stack-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip

      - name: Install Test Dependencies
        run: |
          pip install pytest pytest-cov

      - name: Run robot_brain_stack Unit Tests
        run: |
          cd robot_ws/src/robot_brain_stack
          python -m pytest tests/test_failure_injection.py -v
          python -m pytest tests/test_behavior_tree_components.py -v
          python -m pytest tests/test_stack_integration.py -v

      - name: Generate Coverage Report
        run: |
          cd robot_ws/src/robot_brain_stack
          python -m pytest tests/ --cov=robot_brain_stack --cov-report=term-missing
